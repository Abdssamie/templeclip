services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: videoeditor-frontend
    env_file:
      - .env
    environment:
      AUTH_BASE_URL: https://trykimu.com
      AUTH_TRUSTED_ORIGINS: https://trykimu.com,https://www.trykimu.com
      AUTH_COOKIE_DOMAIN: trykimu.com
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: videoeditor-backend
    env_file:
      - .env
    environment:
      AUTH_BASE_URL: https://trykimu.com
      AUTH_TRUSTED_ORIGINS: https://trykimu.com,https://www.trykimu.com
      AUTH_COOKIE_DOMAIN: trykimu.com
      NODE_ENV: production
      PORT: 8000
    volumes:
      - ./out:/app/out
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: 1g

  redis:
    image: redis:7-alpine
    container_name: kimu-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  render:
    build:
      context: .
      dockerfile: Dockerfile.render
    container_name: kimu-render
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RENDER_SERVER_PORT: 8080
    volumes:
      - render-output:/tmp/renders
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: 2g
    restart: unless-stopped

volumes:
  redis-data:
  render-output:
