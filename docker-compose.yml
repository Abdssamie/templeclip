services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kimu-frontend
    ports:
      - "5173:5173"
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Auth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}

      # R2 Storage
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}

      # API
      API_KEY_SECRET: ${API_KEY_SECRET}

      # App config
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      PROD_DOMAIN: ${PROD_DOMAIN}
      APP_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kimu-network

  redis:
    image: redis:7-alpine
    container_name: kimu-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - kimu-network

  postgres:
    image: postgres:17-alpine
    container_name: kimu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - kimu-network

  render:
    build:
      context: .
      dockerfile: Dockerfile.render
    container_name: kimu-render
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}

      # R2 Storage
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}

      # Render config
      RENDER_API_TOKEN: ${RENDER_API_TOKEN}

      # App config
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RENDER_SERVER_PORT: 8080
      APP_URL: ${APP_URL}
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: 2g
    restart: unless-stopped
    networks:
      - kimu-network

volumes:
  redis-data:
  postgres-data:

networks:
  kimu-network:
    driver: bridge
